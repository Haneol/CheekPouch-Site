# Public site: validate, then deploy to Vercel.
#
# Vercel's Root Directory stays empty (vercel.json at the repo root points at dist/).
# Only a website-* tag at the current main commit deploys production.
name: website

on:
  push:
    tags:
      - "website-*"

permissions:
  contents: read

concurrency:
  group: website-production
  cancel-in-progress: true

env:
  VERCEL_CLI: vercel@62.1.0

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the current main commit
        run: |
          git fetch origin main
          if [ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]; then
            echo "::error::Website release tags must point to the current main commit."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Static site checks
        run: node scripts/validate-site.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Require Vercel secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID are required for a website release."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Pull Vercel settings
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: npx --yes "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### 배포 (production)" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
